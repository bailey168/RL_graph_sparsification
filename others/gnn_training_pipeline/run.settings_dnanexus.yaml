# Learning rate scheduler configurations
schedulers:
  dsst_custom_fc25:
    - scheduler: "warmup_cosine"
      scheduler_params:
        num_warmup_steps: 870
        num_training_steps: 17400  # epochs * batches_per_epoch
        num_cycles: 0.5
        last_epoch: -1
  dsst_custom_fc100:
    - scheduler: "warmup_cosine"
      scheduler_params:
        num_warmup_steps: 870
        num_training_steps: 17400  # epochs * batches_per_epoch
