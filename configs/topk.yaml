# Shared base config for all top-K / RL configs (the others inherit it via `base:`).
# Run directly, it is the fixed-architecture GCN top-K sweep (model.type: gcn); configs/topk_gat.yaml is the GATv2 variant.
# Any key can be overridden from the CLI, e.g. --set training.lr=0.001

paths:
  data_dir: /scratch/bng/cartbind/data/UKB_new_data/combined_data_no_outliers   # combined_data_{TEST}_no_outliers.csv
  eid_dir: /scratch/bng/cartbind/code/MIND_models/scaling_law_splits            # {TEST}/{TEST}_all_eids.txt
  region_dir: /scratch/bng/cartbind/code/RL_graph_sparsification/region_names
  output_dir: /scratch/bng/cartbind/data/RL_outputs/topk

# FC21 = UKB FC25 (21 nodes), FC55 = UKB FC100 (55 nodes).
# Region files keep the original CSV column names, e.g. "FC25 (IC1-IC2)".
fc_types:
  FC21:
    regions_file: FC21_regions.txt
    num_nodes: 21
  FC55:
    regions_file: FC55_regions.txt
    num_nodes: 55

tests:
  GF: p20016_i2
  PAL: p20197_i2
  DSST: p23324_i2
  TMT: p6350_i2

demographics:
  numeric: [p21003_i2, p25741_i2]   # age, head motion
  categorical: [p31, p54_i2]        # sex, assessment centre

split:
  val_frac: 0.15
  test_frac: 0.15
  seed: 42            # used for --max-subjects subsampling, and for the split when per_seed is false
  per_seed: true      # true: each training seed gets its own split (split seed = training seed)
  use_eid_file: true

graph:
  edge_value: standardized  # raw | standardized  -> signed value carried by kept edges (z-score fit on pre-sparsified train edges)
  self_loop_weight: 1.0

sweep:
  fc: [FC55]              # FC types to run (must be keys of fc_types); --fc overrides
  keep_fracs: [1.0, 0.8, 0.6, 0.4, 0.2, 0.0]   # 0.0 = self-loops only (demographics-only reference)
  seeds: [0, 1, 2, 3, 4]
  tests: [GF, DSST]
  # personal: each subject keeps its own top-K by |raw FC|
  # shared: one edge set for everyone - edges most often in train subjects' personal top-K
  # shared is skipped at keep 0.0 and 1.0 (same graphs as personal); summarize.py reuses the personal rows
  masks: [personal]

model:
  type: gcn               # gcn | gatv2 (GATv2 uses edge_attr graphs; graph.self_loop_weight is then unused)
  heads: 4                # GATv2 attention heads (averaged, concat=False); ignored by gcn
  embedding_dim: 64
  hidden_channels: 64
  gnn_num_layers: 3
  classifier_hidden_dims: [32, 16]
  node_dropout: 0.3
  edge_dropout: 0.3       # DropEdge on non-self-loop edges during training (0 = off)
  classifier_dropout: 0.3
  pooling: attention      # attention | mean
  include_demo: true
  demo_embed_dim: 8

training:
  batch_size: 512
  max_epochs: 200
  lr: 0.005
  weight_decay: 0.01
  warmup_epochs: 10
  early_stop_patience: 15
  early_stop_min_delta: 0.0
  compile: false
  num_workers: 0           # pyg loader only
  loader: tensor          # tensor: batches assembled on the device (fast) | pyg: PyG DataLoader; identical results
